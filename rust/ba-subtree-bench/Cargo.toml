[package]
name = "ba-subtree-bench"
version = "0.0.0"
edition = "2021"
publish = false

# Gate 1 throwaway benchmark: native-Rust port of the Block Assembly subtree
# engine, validated byte-identical to go-subtree and benchmarked vs tuned Go.

[dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "ba_subtree_bench"
path = "src/lib.rs"

[[bin]]
name = "replay"
path = "bin/replay.rs"

[[bin]]
name = "reorg"
path = "bin/reorg.rs"

[profile.release]
opt-level = 3
lto = true
